     Apple Mail:   Einstellungen → Signaturen → einfügen

     Outlook:      Neue E-Mail → Signatur → Signaturen… → einfügen.
  4. Hinweis Dark Mode: Signatur ist für helle Hintergründe ausgelegt.

  TIPP: Falls dein Client beim Einfügen Stile entfernt, kopiere stattdessen
  den HTML-Quelltext des <table>-Blocks direkt in den Signatur-HTML-Editor.
